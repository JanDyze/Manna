<svg xmlns="http://www.w3.org/2000/svg" class="manna-logo" viewBox="10 8 139 135" role="img" aria-label="Manna" style="color: #1E2B45">
  <title>Manna</title>
  <style>
.manna-logo { overflow: visible; }
.manna-logo .ml-sweep { transform-box: view-box; }
.manna-logo .ml-sweep-up { transform: translateY(-64px); animation: ml-form-up 1.05s cubic-bezier(.45,.05,.35,1) .1s both; }
.manna-logo .ml-sweep-right { transform: translateX(86px); animation: ml-form-right 1.05s cubic-bezier(.45,.05,.35,1) .1s both; }
.manna-logo .ml-halo { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ml-halo 1.5s ease-out .2s both; }
.manna-logo .ml-word { fill: none; stroke: currentColor; stroke-width: 4.72; stroke-linecap: round; stroke-linejoin: round; }
.manna-logo .ml-letter { animation: ml-up .5s cubic-bezier(.2,.8,.2,1) both; }
.manna-logo.is-still * { animation: none !important; }

@keyframes ml-form-up { from { transform: translateY(0); } }
@keyframes ml-form-right { from { transform: translateX(0); } }
/* a warm glow breathes out behind the mark as it forms, and fades */
@keyframes ml-halo { 0% { opacity: 0; transform: scale(.5); } 50% { opacity: .5; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.45); } }
/* then the name follows */
@keyframes ml-up { from { opacity: 0; transform: translateY(8px); } }

@media (prefers-reduced-motion: reduce) {
  .manna-logo * { animation: none !important; }
}
</style>
  <defs>
    <filter id="ml-blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="7"/></filter>
    <linearGradient id="ml-grad-up" x1="0" y1="0" x2="0" y2="1"><stop offset=".44" stop-color="#000"/><stop offset=".56" stop-color="#fff"/></linearGradient>
    <linearGradient id="ml-grad-right" x1="0" y1="0" x2="1" y2="0"><stop offset=".44" stop-color="#fff"/><stop offset=".56" stop-color="#000"/></linearGradient>
    <mask id="ml-mask-blade" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="150"><rect class="ml-sweep ml-sweep-up" x="60" y="38" width="80" height="128" fill="url(#ml-grad-up)"/></mask>
    <mask id="ml-mask-star" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="150"><rect class="ml-sweep ml-sweep-right" x="-46" y="10" width="152" height="70" fill="url(#ml-grad-right)"/></mask>
  </defs>
  <circle class="ml-halo" cx="82" cy="58" r="26" fill="#E0A544" filter="url(#ml-blur)"/>
  <path class="ml-blade" d="M70.47 93.92 C71.41 65.25 97.02 47.10 127.45 57.55 C94.17 60.07 96.54 85.55 70.47 93.92 Z" fill="#E0A544" mask="url(#ml-mask-blade)"/>
  <path class="ml-star" d="M81.71 19.29 Q85.48 40.91 104.31 51.73 Q75.50 51.04 67.56 69.29 Q58.45 60.25 41.06 57.15 Q75.32 50.88 81.71 19.29 Z" fill="#1E2B45" mask="url(#ml-mask-star)"/>
  <g class="ml-word"><g class="ml-letter" style="animation-delay: 1.20s"><path d="M24.93 129.23 V108.11 L37.07 122.94 L49.69 108.11 V129.23"/></g><g class="ml-letter" style="animation-delay: 1.27s"><ellipse cx="63.85" cy="122.38" rx="6.90" ry="7.09" transform="rotate(-90 63.85 122.38)"/><path d="M71.94 115.15 V129.23"/></g><g class="ml-letter" style="animation-delay: 1.34s"><path d="M79.49 115.15 V129.23"/><path d="M79.49 121.47 A6.32 6.32 0 0 1 92.13 121.47 V129.23"/></g><g class="ml-letter" style="animation-delay: 1.41s"><path d="M99.57 115.15 V129.23"/><path d="M99.57 121.47 A6.32 6.32 0 0 1 112.22 121.47 V129.23"/></g><g class="ml-letter" style="animation-delay: 1.48s"><ellipse cx="125.88" cy="122.38" rx="6.90" ry="7.09" transform="rotate(-90 125.88 122.38)"/><path d="M133.97 115.15 V129.23"/></g></g>
</svg>
